name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to run the workflow manually from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}

  package:
    name: Package Geode Mod
    runs-on: ubuntu-latest
    needs: build # Waits for all OS builds to finish

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Combine and Package Artifacts
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Final Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Level-Tag-System-Mod
          path: ${{ steps.build.outputs.build-output }}